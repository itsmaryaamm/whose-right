# One-click deploy on Render (https://render.com): New → Blueprint → pick this repo.
services:
  - type: web
    name: whos-right
    runtime: docker
    plan: starter # a persistent disk needs a paid instance; cases are stored on it
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false # you'll be asked for it
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
