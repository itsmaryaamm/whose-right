# Alternative to Vercel: Render's free plan (New → Blueprint → pick this repo).
# Use a free Neon database for DATABASE_URL; free Render instances have no disk.
services:
  - type: web
    name: whose-right
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
